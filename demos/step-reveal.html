<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Siren — step-reveal demo</title>
    <link rel="stylesheet" href="../packages/core/src/theme/default.css" />
    <link rel="stylesheet" href="./demo-chrome.css" />
    <script src="./theme-toggle.js"></script>
  </head>
  <body>
    <div class="page-header">
      <h1>Siren step-reveal demo</h1>
      <button id="theme-btn" type="button" class="theme-toggle">Theme: Light</button>
    </div>

    <p class="status" id="status">Step 0 of 0</p>

    <div id="siren-container"></div>

    <!--
      Imports the real Vite library build of siren-board
      (packages/board/dist/siren-board.js), never source files — per ticket
      07's acceptance criteria (original for siren-core, now the same rule
      for siren-board). Run `pnpm --filter siren-core build && pnpm
      --filter siren-board build` first.

      siren-board owns rendering, the text measurer, the Prev/Next/Reset
      control bar, full-bleed sizing, and error display — see ADR-0005 and
      ADR-0006, and .scratch/siren-board-slice/spec.md. This page is left
      with only the things board deliberately doesn't own: fetching the
      source, and the theme toggle.

      The example document itself lives at examples/step-reveal.srn as a
      standalone .srn file — loaded here via fetch(), not inlined — so it
      stays the one shared source of truth for what real Siren syntax looks
      like (this demo, and later the playground/docs, all read the same
      file). Note: fetch() of a local file is blocked by the browser's
      file:// CORS policy, so this page must be served over http(s), e.g.
      `python3 -m http.server` from the repo root — opening the .html file
      directly by double-clicking it will fail to load the example.
    -->
    <script type="module">
      import { createBoard } from "../packages/board/dist/siren-board.js";

      const source = await fetch("../examples/step-reveal.srn").then((response) => {
        if (!response.ok) {
          throw new Error(`Failed to load examples/step-reveal.srn: ${response.status}`);
        }
        return response.text();
      });

      const container = document.getElementById("siren-container");
      const statusEl = document.getElementById("status");


      const board = createBoard(container, {
        source,
        onStepChange: (current, total) => {
          statusEl.textContent = `Step ${current} of ${total}`;
        },
        onDiagnostics: (diagnostics) => {
          for (const diagnostic of diagnostics) {
            console.warn(`[siren] ${diagnostic.severity}: ${diagnostic.message}`);
          }
        },
      });

      if (board.controller === null) {
        statusEl.textContent = "Render failed — see console diagnostics.";
      } else {
        statusEl.textContent = `Step ${board.controller.currentStep} of ${board.controller.totalSteps}`;
      }
    </script>
  </body>
</html>
