<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Siren — complex showcase demo</title>
    <link rel="stylesheet" href="./step-reveal.css" />
  </head>
  <body>
    <h1>Siren complex showcase</h1>
    <p class="intro">
      A branch-and-merge, 11-node flowchart exercising every timeline verb
      (<code>enter</code>/<code>exit</code>/<code>highlight</code>/<code>unhighlight</code>) and
      all seven effects (<code>fade</code>, all four <code>slide-*</code> directions,
      <code>outline</code>, <code>glow</code>) across 22 steps — see
      <a href="./step-reveal.html">the minimal step-reveal demo</a> for a simpler starting point.
    </p>

    <div class="controls">
      <button id="prev-btn" type="button">Prev</button>
      <button id="next-btn" type="button">Next</button>
      <button id="reset-btn" type="button">Reset</button>
    </div>

    <p class="status" id="status">Step 0 of 0</p>

    <div id="siren-container"></div>

    <!--
      Same mechanism as demos/step-reveal.html: imports the real Vite library
      build, loads its example document via fetch() from
      examples/complex-showcase.srn (not inlined). Must be served over
      http(s) — file:// will fail fetch() due to CORS. Every next()/prev()
      transition in this document was already verified programmatically
      (forward walk vs. backward walk, snapshot-compared per element per
      step) before this page was written — this page is for visual
      confirmation, not first discovery of correctness.
    -->
    <script type="module">
      import { render } from "../packages/core/dist/siren-core.js";

      const source = await fetch("../examples/complex-showcase.srn").then((response) => {
        if (!response.ok) {
          throw new Error(`Failed to load examples/complex-showcase.srn: ${response.status}`);
        }
        return response.text();
      });

      function createBrowserTextMeasurer() {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        ctx.font = "14px system-ui, sans-serif";
        const paddingX = 24;
        const lineHeight = 32;

        return {
          measure(text) {
            const { width } = ctx.measureText(text);
            return { width: width + paddingX, height: lineHeight };
          },
        };
      }

      const container = document.getElementById("siren-container");
      const statusEl = document.getElementById("status");
      const prevBtn = document.getElementById("prev-btn");
      const nextBtn = document.getElementById("next-btn");
      const resetBtn = document.getElementById("reset-btn");

      const { svg, controller, diagnostics } = render(source, container, {
        measureText: createBrowserTextMeasurer(),
      });

      for (const diagnostic of diagnostics) {
        console.warn(`[siren] ${diagnostic.severity}: ${diagnostic.message}`);
      }

      if (svg === null || controller === null) {
        statusEl.textContent = "Render failed — see console diagnostics.";
      } else {
        const updateStatus = () => {
          statusEl.textContent = `Step ${controller.currentStep} of ${controller.totalSteps}`;
        };
        updateStatus();

        prevBtn.addEventListener("click", () => {
          controller.prev();
          updateStatus();
        });

        nextBtn.addEventListener("click", () => {
          controller.next();
          updateStatus();
        });

        resetBtn.addEventListener("click", () => {
          controller.reset();
          updateStatus();
        });
      }
    </script>
  </body>
</html>
